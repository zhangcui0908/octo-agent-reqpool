name: 定时扫描需求池
on:
  schedule:
    - cron: '*/5 * * * *'  # 每5分钟
  workflow_dispatch: {}  # 支持手动触发

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 扫描 issue 变化
        id: scan
        env:
          GH_TOKEN: *** github.token }}
        run: |
          LAST_STATE="$(cat .issue-state.json 2>/dev/null || echo '[]')"
          CUR="$(gh api "repos/${{ github.repository }}/issues?state=all&per_page=100&sort=updated" --jq '[.[] | select(.pull_request == null) | {number, title, state, labels: [.labels[].name], updated_at}]')"

          echo "$CUR" > .issue-state.json

          # 用文件传替代 heredoc 传参，解决单引号引起的变量展开问题
          cat > /tmp/scan_script.py << 'SCRIPTEOF'
          import json, os

          prev_raw = os.environ.get('LAST_STATE', '[]')
          cur_raw = os.environ.get('CUR_DATA', '[]')
          prev = json.loads(prev_raw)
          cur = json.loads(cur_raw)

          pmap = {i['number']: i for i in prev} if isinstance(prev, list) else {}
          cmap = {i['number']: i for i in cur}
          changes = []
          for n in sorted(set(cmap) - set(pmap)):
              c = cmap[n]
              changes.append(f"📦 NEW #{n} [{c['state']}] {c['title']} 标签={'/'.join(c['labels']) or '无'}")
          for n in sorted(set(pmap) & set(cmap)):
              p, c = pmap[n], cmap[n]
              if p['state'] != c['state']:
                  changes.append(f"🔄 STATE #{n} {p['state']}→{c['state']} {c['title']}")
              elif set(p['labels']) != set(c['labels']):
                  changes.append(f"🏷 LABEL #{n} {'/'.join(p['labels'])}→{'/'.join(c['labels'])} {c['title']}")

          # 写入 changes.txt
          with open('changes.txt', 'w') as f:
              f.write('\n'.join(changes) + '\n')

          # 输出到 GITHUB_OUTPUT
          gh_out = os.environ.get('GITHUB_OUTPUT', '')
          if gh_out:
              with open(gh_out, 'a') as f:
                  f.write(f"count={len(changes)}\n")

          print(f"count={len(changes)}")
          for ch in changes:
              print(ch)
          SCRIPTEOF

          export LAST_STATE
          export CUR_DATA="$CUR"
          python3 /tmp/scan_script.py

      - name: 记录执行日志
        if: always()
        run: echo "scanned_at=$(date -u +%Y-%m-%dT%H:%M:%SZ) changes=${{ steps.scan.outputs.count }}" >> scan-history.log

      - name: 提交扫描状态与日志
        run: |
          git config user.name "octo-pm-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .issue-state.json scan-history.log changes.txt
          git commit -m "chore: 定时扫描记录 $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "无变化"
          git push
